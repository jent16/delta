name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # No API keys anywhere in CI: the integration tests run the real server
      # against scripts/mock-api.js (a stand-in for Claude and Notion), and
      # the Simplify listings are stubbed, so nothing here costs money or
      # touches the network.
      - run: npm test
