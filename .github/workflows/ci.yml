name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The tracker: the product. Needs Node only (no Python, no network, no API keys).
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck

      - run: npm run test:tracker

  # The original Delta (parked, never deployed). Its tests build a SQLite file with python3 and run the real
  # server against scripts/mock-api.js, so nothing here costs money or touches the network. Kept so the parked
  # code stays working, but it can no longer slow down or fail the tracker's job.
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - run: npm run test:legacy
