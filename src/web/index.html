<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 4l8.5 15h-17z' fill='%2314120F'/%3E%3C/svg%3E">
<!-- applies the saved look before the first paint, so there is no flash of the wrong theme -->
<script src="theme-init.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Application details" hidden></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="New application" hidden></div>
<div id="bulk" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="state-msg">Delta needs JavaScript to run.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
